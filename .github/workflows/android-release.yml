name: Android Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to release
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: ev-charge-book-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-latest
    environment: production
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
      APK_FILE: ev-charge-book-0.1.${{ github.run_number }}.apk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve checked-out commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate Android release baseline
        shell: bash
        run: |
          set -eu
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        shell: bash
        run: |
          set -eu
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/release.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
        run: |
          set -eu
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          BUILD_TOOLS_VERSION="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare atomic upload
        shell: bash
        run: |
          set -eu
          mkdir -p release-upload
          cp android/app/build/outputs/apk/release/app-release.apk "release-upload/$APK_FILE.part"
          sha256sum "release-upload/$APK_FILE.part" | tee "release-upload/$APK_FILE.sha256"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ev-charge-book-${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            mkdir -p /opt/ev-charge-book/releases
            mkdir -p /opt/ev-charge-book/latest
            mkdir -p /opt/ev-charge-book/release-meta
            mkdir -p /opt/ev-charge-book/release-upload
            test -w /opt/ev-charge-book

      - name: Upload signed APK and deploy script
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: release-upload,scripts/deploy-android-release.sh
          target: /opt/ev-charge-book
          overwrite: true

      - name: Activate release atomically
        uses: appleboy/ssh-action@v1.2.2
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          APK_FILE: ${{ env.APK_FILE }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: VERSION_CODE,VERSION_NAME,APK_FILE,RELEASE_SHA
          script: |
            set -eu
            cd /opt/ev-charge-book
            chmod +x scripts/deploy-android-release.sh
            scripts/deploy-android-release.sh

      - name: Write release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## EV Charge Book production release"
            echo ""
            echo "- Ref: \`${{ inputs.ref }}\`"
            echo "- Commit: \`${{ steps.source.outputs.sha }}\`"
            echo "- Version: \`${{ env.VERSION_NAME }}\`"
            echo "- APK: \`${{ env.APK_FILE }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
