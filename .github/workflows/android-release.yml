name: Android Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to release
        required: true
        default: main
      release_series:
        description: Release series, for example 0.4
        required: true
        default: '0.4'

permissions:
  contents: read

concurrency:
  group: ev-charge-book-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-latest
    environment: production
    env:
      # Version values exist only inside the manual production release workflow.
      # Normal commits / Android CI keep the dev version from build.gradle.kts.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.release_series }}.${{ github.run_number }}
      APK_FILE: ev-charge-book-${{ inputs.release_series }}.${{ github.run_number }}.apk
      UPDATE_MANIFEST_URL: https://groupim.cn/ev-charge-book/release-meta/latest.json
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve checked-out commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate Android release baseline
        shell: bash
        run: |
          set -eu
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f scripts/verify-android-update-endpoint.py
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          case "$VERSION_NAME" in
            *-dev|*SNAPSHOT*) echo "Refusing to publish a development version: $VERSION_NAME"; exit 1 ;;
          esac

      - name: Verify current public update discovery route
        shell: bash
        run: |
          set -eu
          python3 scripts/verify-android-update-endpoint.py \
            --manifest-url "$UPDATE_MANIFEST_URL" \
            --check-apk

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        shell: bash
        run: |
          set -eu
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/release.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
          APP_UPDATE_MANIFEST_URL: ${{ env.UPDATE_MANIFEST_URL }}
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
        run: |
          set -eu
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          BUILD_TOOLS_VERSION="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare atomic upload
        shell: bash
        run: |
          set -eu
          mkdir -p release-upload
          cp android/app/build/outputs/apk/release/app-release.apk "release-upload/$APK_FILE.part"
          sha256sum "release-upload/$APK_FILE.part" | tee "release-upload/$APK_FILE.sha256"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ev-charge-book-${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.COMMON_SERVER_HOST }}
          username: ${{ secrets.COMMON_SERVER_USER }}
          key: ${{ secrets.COMMON_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            mkdir -p /opt/ev-charge-book/releases
            mkdir -p /opt/ev-charge-book/latest
            mkdir -p /opt/ev-charge-book/release-meta
            mkdir -p /opt/ev-charge-book/release-upload
            test -w /opt/ev-charge-book

      - name: Upload signed APK and deploy script
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.COMMON_SERVER_HOST }}
          username: ${{ secrets.COMMON_SERVER_USER }}
          key: ${{ secrets.COMMON_SSH_PRIVATE_KEY }}
          source: release-upload,scripts/deploy-android-release.sh
          target: /opt/ev-charge-book
          overwrite: true

      - name: Activate release atomically
        uses: appleboy/ssh-action@v1.2.2
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          APK_FILE: ${{ env.APK_FILE }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        with:
          host: ${{ secrets.COMMON_SERVER_HOST }}
          username: ${{ secrets.COMMON_SERVER_USER }}
          key: ${{ secrets.COMMON_SSH_PRIVATE_KEY }}
          envs: VERSION_CODE,VERSION_NAME,APK_FILE,RELEASE_SHA
          script: |
            set -eu
            cd /opt/ev-charge-book
            chmod +x scripts/deploy-android-release.sh
            scripts/deploy-android-release.sh

      - name: Verify published release through public update endpoint
        shell: bash
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
            if python3 scripts/verify-android-update-endpoint.py \
              --manifest-url "$UPDATE_MANIFEST_URL" \
              --expected-version-code "$VERSION_CODE" \
              --expected-version-name "$VERSION_NAME" \
              --check-apk; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 3
            fi
          done
          echo "Published release is not discoverable through $UPDATE_MANIFEST_URL" >&2
          exit 1

      - name: Write release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## EV Charge Book production release"
            echo ""
            echo "- Ref: \`${{ inputs.ref }}\`"
            echo "- Commit: \`${{ steps.source.outputs.sha }}\`"
            echo "- Version: \`${{ env.VERSION_NAME }}\`"
            echo "- Version code: \`${{ env.VERSION_CODE }}\`"
            echo "- APK: \`${{ env.APK_FILE }}\`"
            echo "- Public update manifest: \`${{ env.UPDATE_MANIFEST_URL }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
