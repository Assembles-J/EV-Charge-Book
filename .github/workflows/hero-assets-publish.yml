name: Hero Assets Validate

on:
  pull_request:
    paths:
      - 'hero-assets/**'
      - '.github/workflows/hero-assets-publish.yml'
  push:
    branches: [main]
    paths:
      - 'hero-assets/**'
      - '.github/workflows/hero-assets-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ev-charge-book-hero-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Hero artwork package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Hero asset package
        shell: bash
        run: |
          set -eu
          test -f hero-assets/manifest-v1.json
          test -d hero-assets/remote

          oversized="$(find hero-assets/remote -type f -name '*.webp' -size +2500k -print)"
          if [ -n "$oversized" ]; then
            echo "Remote Hero artwork exceeds the 2.5 MB safety ceiling:"
            echo "$oversized"
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('hero-assets')
          manifest = json.loads((root / 'manifest-v1.json').read_text())
          assert manifest.get('schemaVersion') == 1
          artworks = manifest.get('artworks') or {}
          assert artworks, 'manifest artworks must not be empty'

          prefix = 'https://raw.githubusercontent.com/Assembles-J/EV-Charge-Book/main/hero-assets/remote/'
          for key, item in artworks.items():
              version = item.get('version')
              url = item.get('url', '')
              assert isinstance(version, int) and version > 0, f'{key}: invalid version'
              assert url.startswith(prefix), f'{key}: invalid URL'
              filename = url.rsplit('/', 1)[-1]
              path = root / 'remote' / filename
              assert path.is_file(), f'{key}: missing {filename}'
              assert path.stat().st_size > 0, f'{key}: empty {filename}'
          PY
