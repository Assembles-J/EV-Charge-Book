name: Apply Dashboard Glass Compile Fix

on:
  push:
    branches:
      - fix/dashboard-edge-to-edge-glass
    paths:
      - scripts/fix-dashboard-glass-compile.py
      - .github/workflows/fix-dashboard-glass-compile.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/dashboard-edge-to-edge-glass
          fetch-depth: 0

      - name: Apply compatibility fix
        run: python3 scripts/fix-dashboard-glass-compile.py

      - name: Verify replacements
        shell: bash
        run: |
          set -eu
          ! grep -F 'matchParentSize' android/app/src/main/java/com/evchargebook/ui/dashboard/HeroVehicleCard.kt
          grep -F '.padding(start = 12.dp, end = 12.dp, bottom = 12.dp)' android/app/src/main/java/com/evchargebook/ui/dashboard/HeroVehicleCard.kt
          grep -F '.fillMaxSize()' android/app/src/main/java/com/evchargebook/ui/dashboard/HeroVehicleCard.kt

      - name: Commit source fix
        shell: bash
        run: |
          set -eu
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/app/src/main/java/com/evchargebook/ui/dashboard/HeroVehicleCard.kt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(ui): use Compose-compatible Hero glass modifiers'
          git push origin HEAD:fix/dashboard-edge-to-edge-glass
