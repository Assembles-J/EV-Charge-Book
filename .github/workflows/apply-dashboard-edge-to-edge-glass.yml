name: Apply Dashboard Edge-to-Edge Patch

on:
  push:
    branches:
      - fix/dashboard-edge-to-edge-glass
    paths:
      - scripts/apply-dashboard-edge-to-edge-glass.py
      - .github/workflows/apply-dashboard-edge-to-edge-glass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/dashboard-edge-to-edge-glass
          fetch-depth: 0

      - name: Apply focused source patch
        run: python3 scripts/apply-dashboard-edge-to-edge-glass.py

      - name: Verify expected source changes
        shell: bash
        run: |
          set -eu
          grep -F 'contentWindowInsets = if (!hasOverlayPage && tab == 0)' android/app/src/main/java/com/evchargebook/MainActivity.kt
          grep -F 'edgeToEdgeTop = true' android/app/src/main/java/com/evchargebook/ui/dashboard/DashboardScreen.kt
          grep -F 'topSystemInset = if (edgeToEdgeTop)' android/app/src/main/java/com/evchargebook/ui/dashboard/HeroVehicleCard.kt
          grep -F '.align(Alignment.BottomCenter)' android/app/src/main/java/com/evchargebook/ui/dashboard/HeroVehicleCard.kt
          grep -F 'Brush.horizontalGradient' android/app/src/main/java/com/evchargebook/ui/dashboard/HeroVehicleCard.kt

      - name: Commit applied source changes
        shell: bash
        run: |
          set -eu
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/app/src/main/java/com/evchargebook/MainActivity.kt \
                  android/app/src/main/java/com/evchargebook/ui/dashboard/DashboardScreen.kt \
                  android/app/src/main/java/com/evchargebook/ui/dashboard/HeroVehicleCard.kt
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'fix(ui): integrate dashboard Hero with system bar and glass panel'
          git push origin HEAD:fix/dashboard-edge-to-edge-glass
