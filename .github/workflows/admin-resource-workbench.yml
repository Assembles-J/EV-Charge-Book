name: Admin Resource Workbench

on:
  pull_request:
    paths:
      - 'hero-admin/static/resource-workbench.html'
      - 'hero-admin/static/resource-workbench.css'
      - 'hero-admin/static/resource-workbench.js'
      - 'hero-admin/static/asset-bundle-prompt.html'
      - 'hero-admin/templates/index.html'
      - 'docs/RESOURCE_BUNDLE_WORKFLOW.md'
      - '.github/workflows/admin-resource-workbench.yml'
  push:
    branches: [main]
    paths:
      - 'hero-admin/static/resource-workbench.html'
      - 'hero-admin/static/resource-workbench.css'
      - 'hero-admin/static/resource-workbench.js'
      - 'hero-admin/static/asset-bundle-prompt.html'
      - 'hero-admin/templates/index.html'
      - 'docs/RESOURCE_BUNDLE_WORKFLOW.md'
      - '.github/workflows/admin-resource-workbench.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify resource workbench JavaScript
        shell: bash
        run: |
          set -eu
          node --check hero-admin/static/resource-workbench.js
          node - <<'NODE'
          require('./hero-admin/static/resource-workbench.js');
          const assert=require('assert');
          const h=globalThis.__evResourceWorkbenchTest;
          assert.equal(h.normalizeToken('brand_BYD_dark_v2.WEBP'),'brand-byd-dark-v2');
          assert.equal(h.stripHeroVariant('byd-seal-08-2026-light'),'byd-seal-08-2026');
          assert.equal(h.heroVariantKey('byd-seal-08-2026','dark'),'byd-seal-08-2026-dark');
          assert.equal(h.heroVariantKey('byd-seal-08-2026-light','dark'),'byd-seal-08-2026-dark');
          const targets=[
            {id:'xiaomi-su7',aliases:['xiaomi-su7','hero-xiaomi-su7']},
            {id:'xiaomi-su7-ultra',aliases:['xiaomi-su7-ultra','hero-xiaomi-su7-ultra']},
          ];
          assert.equal(h.longestPrefix('hero_xiaomi-su7-ultra_dark_final.webp',targets).target.id,'xiaomi-su7-ultra');
          const diffs=h.fieldDiff({rangeKm:500,series:'A'},{rangeKm:520,series:'A'},['rangeKm','series']);
          assert.deepEqual(diffs,[{field:'rangeKm',before:500,after:520}]);
          assert.equal(
            h.nextHeroFilename('demo-car','light',{artworks:{'demo-car-light':{version:3,url:'https://example.com/a.webp'}}}),
            'demo_car_light_v4.webp'
          );
          NODE
      - name: Verify Web contracts
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          workbench=Path('hero-admin/static/resource-workbench.html').read_text(encoding='utf-8')
          js=Path('hero-admin/static/resource-workbench.js').read_text(encoding='utf-8')
          prompt=Path('hero-admin/static/asset-bundle-prompt.html').read_text(encoding='utf-8')
          index=Path('hero-admin/templates/index.html').read_text(encoding='utf-8')
          doc=Path('docs/RESOURCE_BUNDLE_WORKFLOW.md').read_text(encoding='utf-8')
          for marker in [
              '车型资源工作台','单车型资源包 JSON','Logo + Hero 统一投递','resourceQueue',
              'configUpdateConfirm','heroUpdateConfirm','确认并发布整套资源'
          ]:
              if marker not in workbench:
                  raise SystemExit(f'missing workbench marker: {marker}')
          for marker in [
              'ev-charge-book-resource-bundle','target-select','__custom__','手动选择品牌 / Hero Key',
              'heroVariantKey','-dark','-light','api/brand/logo','api/publish','api/catalog/save',
              '服务器保存：','第一张优先'
          ]:
              if marker not in js:
                  raise SystemExit(f'missing workbench behavior: {marker}')
          for marker in [
              '全量资产包 Prompt','prompt-library.html','brand_<brandId>_light.webp',
              'brand_<brandId>_dark.webp','hero_<heroKey>_dark.webp','hero_<heroKey>_light.webp',
              'catalogImport','needsSource','updateIntent','当前已有 Hero 语义 Key',
              'Light Hero 变体规则'
          ]:
              if marker not in prompt:
                  raise SystemExit(f'missing full prompt marker: {marker}')
          for marker in ['static/resource-workbench.html','static/asset-bundle-prompt.html','单项规范 / Prompt']:
              if marker not in index:
                  raise SystemExit(f'missing admin entry: {marker}')
          for marker in ['<heroArtworkKey>-dark','<heroArtworkKey>-light','automatic matching is only a suggestion','explicit confirmation']:
              if marker not in doc:
                  raise SystemExit(f'missing authority rule: {marker}')
          PY
